name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping via Vercel API (no secrets needed)
        run: |
          curl -s -o /dev/null -w "%{http_code}" "https://metal-sport.vercel.app/api/ping"
